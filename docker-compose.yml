services:
  db:
    image: postgres:16-alpine
    container_name: talentlens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentlens}
      POSTGRES_DB: ${POSTGRES_DB:-talentlens}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - talentlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentlens} -d ${POSTGRES_DB:-talentlens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentlens-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talentlens}:${POSTGRES_PASSWORD:-talentlens}@db:5432/${POSTGRES_DB:-talentlens}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      PORT: 5001
      MAX_RESUMES: ${MAX_RESUMES:-150}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
    ports:
      - "${API_PORT:-5001}:5001"
    volumes:
      - ./uploads:/app/uploads
      - ./instance:/app/instance
      - ./models:/app/models:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentlens-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  talentlens_pgdata:
